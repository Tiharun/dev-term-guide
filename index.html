/* FONT:END */
:root{
  --ink:#1d2b4f;--ink-2:#2c3d68;--ink-3:#3b4f82;
  --ground:#f6f8f7;--plate:#ffffff;--fig:#edf1f5;--rule:#d3dbe4;--rule-2:#e6ebf0;
  --text:#1d2b4f;--muted:#4a587a;--soft:#6a7690;
  --moss:#4d6d40;--moss-bg:#e8efe3;
  --mark:#e0662b;--mark-text:#a8410f;--mark-bg:#fdf0e8;
  --sky:#b9c7d8;--steel:#8fa3bd;
  --ch1:#3566b8;--ch2:var(--mark);--ch3:#13a08a;
  --tl-r:#ff5f57;--tl-y:#febc2e;--tl-g:#28c840;
  --serif:'Hahmlet','HANBatang','Batang','바탕','AppleMyungjo',serif;
  --sans:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --mono:Consolas,'D2Coding','Courier New',monospace;
  --nav:268px;--r:10px;
  --shadow:0 1px 2px rgba(15,20,30,.06),0 6px 18px rgba(15,20,30,.07);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{font-family:var(--sans);background:var(--ground);color:var(--text);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;scrollbar-color:var(--steel) var(--ground)}
::selection{background:#f7cdb6;color:var(--ink)}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px;border-radius:4px}
a{color:inherit;text-underline-offset:3px;text-decoration-thickness:1px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;caret-color:var(--mark)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--plate);border-right:1px solid var(--rule);
  padding:26px 18px 30px;scrollbar-width:thin}
.brand{display:block;text-decoration:none;font-family:var(--serif);font-weight:800;font-size:23px;letter-spacing:-.02em;line-height:1.2}
.vol{font-size:12.5px;color:var(--moss);font-weight:700;margin:6px 0 20px}
.navlinks{display:flex;gap:6px;margin-bottom:18px}
.navlinks a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:13px;
  border:1px solid var(--rule);border-radius:8px;padding:7px 4px;color:var(--muted)}
.navlinks a:hover{border-color:var(--ink);color:var(--ink)}
.navlinks a[aria-current]{background:var(--ink);border-color:var(--ink);color:#fff}
.navlinks svg.i{width:15px;height:15px}
.cat{display:flex;align-items:baseline;gap:10px;padding:8px 8px;border-radius:7px;text-decoration:none;font-size:14.5px;
  border-bottom:1px dotted var(--rule)}
.cat .no{width:22px;flex:none;color:var(--moss);font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.cat .cnt{margin-left:auto;font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.cat:hover{background:var(--fig)}
.cat[aria-current]{color:var(--mark-text);font-weight:800}
.cat[aria-current] .no{color:var(--mark-text)}
.subs{padding:4px 0 8px 40px}
.subs a{display:block;font-size:13.5px;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px}
.subs a:hover{color:var(--ink);background:var(--fig)}
.subs a[aria-current]{color:var(--ink);font-weight:800;background:var(--mark-bg)}
.main{min-width:0;padding:28px clamp(18px,3.4vw,52px) 80px}
.inner{max-width:1120px;margin:0 auto}
.menu-btn{display:none}

/* ---------- key band (검색표) ---------- */
.key{background:var(--ink);color:#f3f6fb;border-radius:14px;padding:20px 22px 18px;box-shadow:var(--shadow)}
.key-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.key .kh{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.key-q{color:#c9d3e6;font-size:14.5px}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;background:#f6f8f7;color:var(--ink);border-radius:9px;
  padding:0 14px;width:min(380px,100%);height:46px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15.5px}
.search input::placeholder{color:#5f6c86}
.search kbd{font-family:var(--sans);font-size:12px;color:var(--muted);border:1px solid var(--rule);border-radius:5px;padding:0 6px}
.steps{display:flex;align-items:flex-start;gap:10px;margin-top:16px;flex-wrap:wrap}
.step-lab{font-size:12.5px;color:#aebbd6;font-weight:700;width:100%;display:flex;gap:8px;align-items:center}
.step-lab b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--mark);color:#fff;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--ink-2);color:#eef2f9;border:1px solid #42568a;border-radius:999px;padding:6px 13px;font-size:14px;
  transition:background .2s,border-color .2s}
.chip:hover{border-color:#8ea2cc;background:var(--ink-3)}
.chip[aria-pressed=true]{background:#f6f8f7;color:var(--ink);border-color:#f6f8f7;font-weight:700}
.chip.term{background:var(--mark);border-color:var(--mark);color:#fff;font-weight:700;text-decoration:none}
.chip.term:hover{background:#c8551d}
.steps .col{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 320px}
.steps .col.done{flex:0 0 auto}
.steps .arr{align-self:flex-end;color:var(--mark);font-weight:800;padding-bottom:7px}
.chip .redo{margin-left:8px;font-size:12px;font-weight:400;color:var(--muted);text-decoration:underline}

/* ---------- headings ---------- */
.crumb{font-size:13.5px;color:var(--moss);font-weight:700;margin:32px 0 6px;display:flex;gap:6px;flex-wrap:wrap}
.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}
.crumb span{color:var(--soft)}
h1.title{font-family:var(--serif);font-size:clamp(30px,3.4vw,42px);font-weight:700;letter-spacing:-.025em;line-height:1.2;text-wrap:balance}
.lead{color:var(--muted);font-size:16px;margin-top:8px;max-width:68ch}
.secs{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;gap:2px;margin:24px 0 8px;border-bottom:1px solid var(--rule)}
.sec{text-decoration:none;font-size:14.5px;color:var(--muted);padding:9px 10px 10px;white-space:nowrap;flex:none;border-radius:9px 9px 0 0;
  border:1px solid transparent;border-bottom:0;margin-bottom:-1px;display:flex;gap:7px;align-items:baseline}
.sec small{font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.sec:hover{color:var(--ink);background:var(--fig)}
.sec[aria-current]{background:var(--plate);color:var(--ink);font-weight:800;border-color:var(--rule);
  box-shadow:inset 0 3px 0 var(--mark)}
.sec-intro{font-size:14.5px;font-weight:400;color:var(--muted);margin:14px 0 4px}

/* ---------- plate (용어 도판) ---------- */
.plates{display:flex;flex-direction:column;gap:22px;margin-top:18px}
.plate{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:28px;background:var(--plate);
  border:1px solid var(--rule);border-radius:14px;padding:24px;scroll-margin-top:20px;position:relative}
.plate:target,.plate.flash{box-shadow:0 0 0 3px var(--mark-bg),0 0 0 4px var(--mark)}
.fig{position:relative;background:var(--fig);border-radius:10px;min-height:290px;overflow:hidden;display:flex;flex-direction:column}
.stage{flex:1;position:relative;display:grid;place-items:center;padding:26px 22px 44px;min-height:250px}
.stage{grid-template-columns:minmax(0,1fr)}.stage>*{max-width:100%}
.figcap{position:absolute;left:14px;bottom:11px;font-size:12.5px;color:var(--muted);right:96px;line-height:1.35}
.figcap b{color:var(--moss);font-variant-numeric:tabular-nums}
.play{position:absolute;right:10px;bottom:8px;display:flex;align-items:center;gap:6px;background:var(--plate);
  border:1px solid var(--rule);border-radius:999px;padding:4px 12px 4px 9px;font-size:12.5px;color:var(--ink);z-index:3}
.play:hover{border-color:var(--ink)}
.play svg.i{width:14px;height:14px}
.leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.leaders line{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:var(--len,200);stroke-dashoffset:var(--len,200);transition:stroke-dashoffset .9s var(--ease)}
.leaders circle{fill:var(--mark);opacity:0;transition:opacity .3s .5s}
.lab{position:absolute;z-index:3;font-size:12.5px;font-weight:700;background:var(--plate);border:1px solid var(--ink);border-radius:5px;
  padding:2px 8px;white-space:nowrap;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:opacity .35s .55s,transform .5s .55s var(--ease)}
.fig.seen .leaders line{stroke-dashoffset:0}
.fig.seen .leaders circle{opacity:1}
.fig.seen .lab{opacity:1;transform:translate(-50%,-50%) scale(1)}
.desc{min-width:0;display:flex;flex-direction:column}
.term-h{display:flex;align-items:flex-start;gap:10px}
.term-en{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere}
.term-ko{color:var(--muted);font-size:14.5px;margin:3px 0 12px}
.acts{margin-left:auto;display:flex;gap:4px;flex:none}
.act{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--soft);border:1px solid transparent}
.act:hover{color:var(--ink);border-color:var(--rule)}
.act[aria-pressed=true]{color:var(--mark-text)}
.act[aria-pressed=true] svg.i{fill:var(--mark-bg)}
.row{display:grid;grid-template-columns:78px 1fr;gap:10px;font-size:15px;line-height:1.7;padding:9px 0;border-top:1px solid var(--rule-2)}
.row>b{color:var(--moss);font-size:13.5px;padding-top:2px}
.row code,.say code{font-family:var(--mono);font-size:.92em;background:var(--fig);padding:1px 5px;border-radius:4px}
.say{margin-top:10px;background:var(--mark-bg);border:1px solid #f3c9b2;border-radius:10px;padding:11px 12px 11px 14px;display:flex;gap:10px;align-items:flex-start}
.say-lab{font-size:12px;font-weight:800;color:var(--mark-text);display:block;margin-bottom:2px}
.say p{font-size:15px;line-height:1.6;flex:1}
.copy{flex:none;display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mark-text);border:1px solid #ecb89c;background:var(--plate);
  border-radius:7px;padding:5px 9px;white-space:nowrap}
.copy:hover{border-color:var(--mark-text)}
.copy svg.i{width:14px;height:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.tag{font-size:12.5px;border:1px solid var(--ink);border-radius:999px;padding:2px 10px;display:inline-flex;align-items:center;gap:5px;text-decoration:none;white-space:nowrap}
a.tag:hover{background:var(--ink);color:#fff}
.tag.prac{border-color:var(--moss);color:var(--moss)}
.tag.jg{border-color:var(--mark-text);color:var(--mark-text)}
.lvl{display:inline-flex;gap:2px}.lvl i{width:8px;height:8px;border:1px solid var(--ink);display:block}.lvl i.on{background:var(--ink)}
.rel{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.9}
.rel a{color:var(--ink);font-weight:700;margin-right:8px;text-decoration-color:var(--steel)}
.rel a:hover{text-decoration-color:var(--mark)}
.stamp{position:absolute;top:18px;right:120px;font-family:var(--serif);font-weight:800;font-size:15px;color:var(--mark);
  border:2.5px solid var(--mark);border-radius:6px;padding:1px 9px;transform:rotate(-9deg) scale(1.6);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .45s var(--ease);mix-blend-mode:multiply}
.plate.learned .stamp{opacity:.85;transform:rotate(-9deg) scale(1)}

/* ---------- home ---------- */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0;margin-top:14px;border-top:1px solid var(--rule)}
.vol-row{display:grid;grid-template-columns:42px 1fr auto;gap:4px 12px;padding:16px 10px;border-bottom:1px solid var(--rule);text-decoration:none;align-items:baseline}
.vol-row:hover{background:var(--plate)}
.vol-row .no{font-family:var(--serif);font-size:22px;font-weight:800;color:var(--moss);font-variant-numeric:tabular-nums}
.vol-row .nm{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em}
.vol-row .ct{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.vol-row .ds{grid-column:2/4;font-size:13.5px;color:var(--muted);line-height:1.5}
.h2{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.015em;margin:44px 0 4px}
.h2+p{color:var(--muted);font-size:14.5px}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;margin-top:16px}
.howto div{border-top:2px solid var(--ink);padding-top:12px;font-size:14.5px;color:var(--muted)}
.howto b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty{background:var(--plate);border:1px dashed var(--steel);border-radius:12px;padding:34px;text-align:center;color:var(--muted);margin-top:20px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:20px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:14px;opacity:0;transition:opacity .25s,transform .4s var(--ease);pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- generic visuals ---------- */
.flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;width:100%}
.node{background:var(--plate);border:1.5px solid var(--ink);border-radius:9px;padding:10px 14px;font-size:14px;font-weight:700;text-align:center;
  min-width:78px;box-shadow:0 2px 6px rgba(15,20,30,.08)}
.node.hl{background:var(--ink);color:#fff}
.edge{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--muted);min-width:58px;position:relative}
.edge .ln{width:56px;height:2px;background:var(--steel);position:relative;overflow:hidden;margin:3px 0}
.edge .ln::after{content:"";position:absolute;left:-14px;top:0;width:14px;height:2px;background:var(--mark);animation:pkt 1.8s linear infinite;animation-play-state:var(--ps,paused)}
.edge .hd{position:absolute;right:-1px;top:50%;width:0;height:0}
@keyframes pkt{to{left:100%}}
.stack{display:flex;flex-direction:column;gap:5px;width:min(320px,100%)}
.stack div{background:var(--plate);border:1.5px solid var(--ink);border-radius:7px;padding:8px 12px;font-size:14px;font-weight:700;text-align:center}
.stack div:nth-child(2n){background:#dfe7f0}
.stack div.hl{background:var(--ink);color:#fff}
.tbl{border-collapse:collapse;background:var(--plate);font-size:13.5px;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(15,20,30,.08)}
.tbl th{background:var(--ink);color:#fff;font-weight:700;padding:6px 12px;text-align:left}
.tbl td{border:1px solid var(--rule);padding:6px 12px}
.tbl tr.hl td{background:var(--mark-bg)}
.codebox{background:#1d2b4f;color:#e6ecf7;font-family:var(--mono);font-size:13.5px;line-height:1.6;border-radius:9px;padding:14px 16px;
  white-space:pre;overflow:auto;max-width:100%;text-align:left;width:100%}
.codebox .k{color:#f2a072}.codebox .s{color:#a8d49a}.codebox .c{color:#8fa3bd}
.tree{font-family:var(--mono);font-size:13.5px;line-height:1.75;background:var(--plate);border:1px solid var(--rule);border-radius:9px;padding:12px 18px;white-space:pre}
.tree .hl{background:var(--mark-bg);color:var(--mark-text);font-weight:700}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.cmp>div{background:var(--plate);border-radius:9px;border:1px solid var(--rule);padding:30px 10px 14px;position:relative;display:grid;place-items:center;min-height:150px}
.cmp>div::before{content:attr(data-l);position:absolute;top:7px;left:10px;font-size:11.5px;font-weight:800}
.cmp>.bad::before{color:var(--mark-text)}.cmp>.good::before{color:var(--moss)}
.term-big{font-family:var(--serif);font-size:30px;font-weight:800;color:var(--ink);text-align:center;line-height:1.3}
.term-big small{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400;margin-top:6px}
/* ---------- demos ---------- */
.fig{--ps:paused}.fig.run{--ps:running}
.cv{position:absolute;inset:0}
.cv>*{position:absolute}
.A{animation-play-state:var(--ps)!important}
.blk{background:var(--ink);border-radius:8px}
.blk.s{background:var(--sky)}.blk.m{background:var(--moss)}.blk.o{background:var(--mark)}.blk.w{background:var(--plate);border:1.5px solid var(--ink)}
.bar{height:10px;border-radius:5px;background:var(--steel)}
.bar.d{background:var(--ink)}
.dem{position:relative;width:min(380px,92%);display:flex;flex-direction:column;gap:10px;align-items:stretch}
.mini{background:var(--plate);border:1px solid var(--rule);border-radius:10px;padding:14px;box-shadow:0 2px 6px rgba(15,20,30,.08);position:relative;overflow:hidden}
.btnx{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:700}
.btnx.o{background:var(--plate);color:var(--ink);border:1.5px solid var(--ink)}
.track{position:relative;height:30px;border-bottom:1px dashed var(--steel);width:100%}
.track span{position:absolute;left:0;top:5px;width:20px;height:20px;border-radius:50%;background:var(--ink)}
.track em{position:absolute;right:0;top:-2px;font-style:normal;font-size:11.5px;color:var(--muted)}
.lbl{font-size:12px;color:var(--muted);text-align:center}

.page{width:min(330px,94%);aspect-ratio:4/3.1;background:var(--plate);border:1.5px solid var(--ink);border-radius:8px;display:grid;
  grid-template:"hd hd" 13% "nv nv" 8% "hr hr" 27% "mn sd" 1fr "ft ft" 12%/2.3fr 1fr;gap:5px;padding:7px;font-size:11px;font-weight:700;color:var(--muted)}
.page>div{background:var(--fig);border-radius:4px;display:grid;place-items:center}
.page>div.hl{background:var(--mark);color:#fff}
.win{width:min(360px,94%);aspect-ratio:4/3;background:var(--plate);border:1.5px solid var(--ink);border-radius:9px;overflow:hidden;display:grid;
  grid-template:"tt tt" 12% "mb mb" minmax(18px,8%) "tb tb" 11% "sb ct" 1fr "st st" minmax(18px,8%)/28% 1fr;font-size:11px;font-weight:700;color:var(--muted);gap:3px}

.win>div.hl{background:var(--mark);color:#fff}
.http{text-align:center}
.http b{display:block;font-family:var(--serif);font-size:64px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.http span{display:inline-block;margin-top:10px;font-size:14px;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--plate);border:1px solid var(--ink)}
.http.e2 b{color:var(--moss)}.http.e4 b,.http.e5 b{color:var(--mark-text)}

.gitg circle{stroke:var(--ink);stroke-width:2}

.swatch{display:flex;gap:6px}.swatch i{width:44px;height:64px;border-radius:7px;display:block}

  padding:32px 10px 20px;display:flex;flex-direction:column;overflow:hidden}

  storeKey: 'devdict'
};
const CATS = [];
const TERMS = [];
const SYMPTOMS = [];
const SYMPTOM_GROUPS = ['움직임','위치·간격','글자','색·모양','크기·화면','반응·클릭','느림','오류·안 됨'];
/* 카테고리: id, 이름, 설명, 하위항목 [id, 이름, 소개] */
function CAT(id, name, desc, extra){
  const base = [['basic','기본','처음 듣더라도 꼭 알아야 하는 말'],['core','필수','실제로 만들 때 매일 쓰는 말'],
    ['motion','모션용어 및 연출','움직임과 화면 연출을 부르는 말'],['adv','심화','한 단계 더 들어가면 만나는 말']];
  const tail = [['tip','추천 개념','알아 두면 대화가 쉬워지는 개념']];
  CATS.push({id, no: CATS.length+1, name, desc, secs: [...base, ...extra, ...tail].map(([sid,sname,sdesc])=>({id:sid,name:sname,desc:sdesc}))});
}
/* 용어 묶음 넣기: en 영문명, ko 한글명, d 정의, x 헷갈림, j 현업 은어, jg 은어 자체가 용어, p 말하기 예문,
   r 관련 용어(en), l 난이도 1~3, o 1=공식 근거, u 공식 문서 주소, v 그림 종류, sy 증상 */
function T(c, s, list){ list.forEach(t => TERMS.push(Object.assign(t, {c, s}))); }
/* 증상 색인: 묶음, 증상, 가리키는 용어(en) */
function SYM(g, list){ list.forEach(([q, t]) => SYMPTOMS.push({g, q, t})); }

 {en:'Progressive Disclosure',ko:'점진적 공개 · 필요할 때 더 보여 주기',d:'처음에는 꼭 필요한 것만 보여 주고, 덜 쓰는 기능은 "더 보기"나 다음 단계에 숨겨 두는 방법이에요.',x:'숨긴 기능이 있다는 표시(더 보기, 고급 설정)를 꼭 남겨요. 표시가 없으면 사람들은 그런 기능이 없다고 생각해요.',p:'인쇄 설정 화면이 복잡해. 자주 쓰는 매수·양면만 보이고 나머지는 Progressive Disclosure(점진적 공개)로 "고급 설정" 안에 접어 둬줘',r:['Accordion','Collapse / Expand','Cognitive Load'],l:2,o:0,v:'u-progressive-disclosure'},

 {en:"Hick's Law",ko:'힉의 법칙',d:'고를 수 있는 것이 많고 복잡할수록 결정하는 데 시간이 더 걸린다는 법칙이에요.',x:'무조건 줄이라는 뜻은 아니에요. 비슷한 것끼리 묶고 이름을 분명히 붙이면 많아도 빨리 찾아요. 추천 하나를 먼저 보여 주는 것도 방법이에요.',p:"고객센터 메뉴가 12개라 고르기 힘들어. Hick's Law(힉의 법칙)를 생각해서 자주 찾는 4개만 먼저 보이고 나머지는 묶어줘",r:["Fitts's Law",'Mega Menu','Progressive Disclosure'],l:3,o:0,v:'u-hick-s-law'},
 {en:"Jakob's Law",ko:'제이콥의 법칙 · 익숙한 대로',d:'사람들은 대부분의 시간을 다른 사이트에서 보내서, 내 사이트도 익숙한 곳들처럼 움직이길 기대한다는 법칙이에요.',x:'로고는 왼쪽 위, 장바구니는 오른쪽 위처럼 흔한 자리를 따르면 설명 없이도 써요. 새 방식은 확실히 더 나을 때만 써요.',p:"Jakob's Law(제이콥의 법칙)에 맞게 쇼핑몰 헤더를 바꿔줘. 로고는 왼쪽, 검색창은 가운데, 장바구니는 오른쪽 위에 둬줘",r:['Consistency','Header','Mental Model'],l:2,o:0,v:'u-jakob-s-law'},
 {en:'F-pattern / Z-pattern',ko:'F자·Z자 패턴 · 시선 흐름',d:'사람의 눈이 화면을 훑는 길이에요. 글이 많으면 F자로, 글이 적고 큰 요소가 있으면 Z자로 움직여요.',x:'F자로 읽는 화면은 줄 앞부분만 읽혀요. 제목과 문단 첫머리에 중요한 말을 둬요. Z자 화면은 끝점인 오른쪽 아래에 버튼을 둬요.',p:'랜딩 페이지를 F-pattern / Z-pattern(시선 흐름)에 맞게 다시 배치해줘. 왼쪽 위에 로고, 오른쪽 위에 메뉴, 오른쪽 아래에 가입 버튼을 둬줘',r:['Focal Point','Visual Hierarchy','Hero Section'],l:2,o:0,v:'u-f-pattern-z-pattern'},
 {en:'Information Architecture',ko:'정보 구조 · IA',d:'내용을 어떻게 묶고, 어떤 순서로 놓고, 무슨 이름을 붙일지 정하는 설계예요. 메뉴와 사이트맵의 바탕이 돼요.',x:'회사 부서가 아니라 쓰는 사람이 찾는 방식대로 묶어요. 같은 것은 어디서나 같은 이름으로 불러요.',p:'쇼핑몰 메뉴의 Information Architecture(정보 구조)를 다시 짜줘. 상품, 주문·배송, 고객센터 3개로 묶고 각 아래 메뉴 이름도 정해줘',r:['Sitemap','GNB','Mental Model'],l:3,o:0,v:'u-information-architecture'},
 {en:'Mental Model',ko:'멘탈 모델 · 머릿속 작동 그림',d:'사람이 "이건 이렇게 움직이겠지" 하고 머릿속에 그리는 작동 방식이에요. 사실과 달라도 그 생각대로 행동해요.',x:'휴지통처럼 사람들이 이미 아는 방식에 맞추면 쉬워요. 생각과 다르게 움직이면 실수하고 서비스를 탓해요.',p:'사진 삭제가 Mental Model(멘탈 모델)과 달라. 바로 지우지 말고 휴지통으로 옮긴 뒤 30일 동안 되살릴 수 있게 해줘',r:["Jakob's Law",'Information Architecture','Snackbar'],l:3,o:0,v:'u-mental-model'},
 {en:'Usability Test',ko:'사용성 테스트',d:'실제 사용자에게 "환불 신청해 보세요" 같은 과제를 주고, 쓰는 모습을 지켜보며 어디서 막히는지 찾는 방법이에요.',x:'옆에서 도와주거나 설명하지 않고 지켜보기만 해요. 5명이면 큰 문제는 대부분 보이니, 고친 뒤 다시 5명에게 해 보는 게 좋아요.',p:'결제 화면 Usability Test(사용성 테스트) 계획을 짜줘. 5명에게 줄 과제 3개와 성공 기준을 적어줘',r:['Heuristic Evaluation','A/B Test','Prototype'],l:2,o:0,v:'u-usability-test'},
 {en:'Heuristic Evaluation',ko:'휴리스틱 평가 · 원칙 체크리스트 점검',d:'전문가가 정해진 사용성 원칙 목록(닐슨의 10원칙 등)에 맞춰 화면을 하나씩 점검하는 방법이에요.',x:'사용자 없이 빨리 할 수 있지만, 전문가 생각이라 실제 사용자 반응과 다를 수 있어요. 사용성 테스트와 같이 써요.',p:'이 회원가입 화면을 Heuristic Evaluation(휴리스틱 평가)해줘. 닐슨의 10원칙 기준으로 문제와 심각도를 표로 정리해줘',r:['Usability Test','Error Message','Consistency'],l:3,o:0,v:'u-heuristic-evaluation'},
 {en:'Modular Scale',ko:'모듈러 스케일 · 크기 비율 단계',d:'본문 크기에 같은 비율(예: 1.25배)을 계속 곱해 제목 크기들을 정하는 방법이에요. 크기 차이가 고르게 커져요.',x:'앱 화면은 1.2~1.25배처럼 작은 비율이, 큰 제목이 많은 홍보 페이지는 더 큰 비율이 어울려요.',p:'글자 크기를 Modular Scale(크기 비율 단계)로 정리해줘. 본문 16px에서 1.25배씩 키워서 20·25·31px로 맞춰줘',r:['Font Size','Visual Hierarchy','Design Token'],l:3,o:0,v:'u-modular-scale'},
]);

 {en:'Splash Screen',ko:'스플래시 화면 · 시작 화면',d:'앱을 켜면 첫 화면이 준비될 때까지 잠깐 보이는 화면이에요. 보통 앱 아이콘과 바탕색만 있어요.',x:'준비가 끝나면 바로 사라져야 해요. 일부러 오래 띄우면 기다림만 길어져요. 안드로이드는 12 버전부터 모든 앱에 기본 시작 화면이 붙어요.',p:'앱을 켤 때 Splash Screen(시작 화면)에는 로고만 가운데 두고, 준비가 끝나면 바로 첫 화면으로 넘어가게 해줘',r:['Loading State','Skeleton UI'],l:2,o:0,j:'"스플래시"',v:'u-splash-screen'},
 {en:'Onboarding',ko:'온보딩 · 첫 사용 안내',d:'앱을 처음 쓰는 사람에게 핵심 기능과 쓰는 법을 몇 장으로 알려 주는 과정이에요.',x:'짧게 만들고 언제든 건너뛸 수 있게 해요. 설명을 길게 늘어놓기보다 바로 써 보게 하는 편이 좋아요.',p:'첫 실행 때 Onboarding(첫 사용 안내)을 3장으로 보여주고, 오른쪽 위에 "건너뛰기"를 넣어줘',r:['Empty State','Progressive Disclosure','Tooltip'],l:2,o:0,j:'"온보딩", "튜토리얼"',v:'u-onboarding'},
 {en:'App Bar',ko:'앱 바 · 상단 바',d:'모바일 앱 화면 맨 위에 붙은 줄이에요. 지금 화면 이름, 뒤로 가기, 자주 쓰는 버튼이 들어가요.',x:'웹의 헤더, 프로그램 창의 타이틀 바와 하는 일이 비슷해요. 머티리얼 디자인에서는 Top App Bar라고 불러요.',p:'주문 내역 화면 위에 App Bar(앱 바)를 넣어서 왼쪽은 뒤로 가기, 가운데는 제목, 오른쪽은 검색 아이콘을 둬줘',r:['Title Bar','Back Button','Tab Bar'],l:1,o:0,j:'"헤더", "상단 바"',v:'u-app-bar'},
 {en:'Scrollbar',ko:'스크롤바 · 스크롤 막대',d:'내용이 영역보다 길 때 옆에 생기는 막대예요. 손잡이 위치는 지금 보는 곳을, 손잡이 길이는 한 번에 보이는 양을 알려 줘요.',x:'맥에서 트랙패드를 쓰면 스크롤할 때만 잠깐 보였다 사라지는 게 기본이에요. 마우스로 쓰는 곳에서는 손잡이를 잡아 끌 수 있어야 해요.',p:'목록 영역에만 Scrollbar(스크롤바)가 생기게 하고, 막대를 얇고 연한 색으로 바꿔줘',r:['Overflow','Momentum Scroll'],l:1,o:0,v:'u-scrollbar'},
 {en:'Split Pane',ko:'스플릿 페인 · 나눈 창',d:'한 창을 둘 이상으로 나누고, 가운데 경계선을 끌어 크기를 조절하게 만든 구조예요.',x:'파일 목록과 편집기, 메일 목록과 본문처럼 두 가지를 함께 볼 때 써요. 경계선은 키보드 화살표로도 움직일 수 있어야 해요.',p:'왼쪽 파일 목록과 오른쪽 편집기를 Split Pane(나눈 창)으로 만들고, 가운데 경계선을 끌거나 화살표 키로 너비를 바꾸게 해줘',r:['Side Panel','Master-Detail','Split Screen'],l:2,o:0,v:'u-split-pane'},
 {en:'Shortcut Key',ko:'단축키 · 키보드 단축키',d:'메뉴를 찾아 누르는 대신 키 몇 개를 함께 눌러 바로 실행하는 방법이에요. Ctrl+C(복사)처럼요.',x:'메뉴 옆에 단축키를 적어 두면 쓰다가 저절로 외워요. 맥에서는 Ctrl 대신 ⌘(Command) 키를 써요. ⌘C가 복사예요.',p:'저장 기능에 Shortcut Key(단축키) Ctrl+S를 달고, 메뉴의 "저장" 옆에 단축키를 적어줘',r:['Menu Bar','Context Menu','Tooltip'],l:1,o:0,j:'"단축키", "핫키"',v:'u-shortcut-key'},
 {en:'Window Controls',ko:'창 조절 버튼 · 최소화·최대화·닫기',d:'프로그램 창 맨 위 구석에 있는 최소화·최대화·닫기 버튼 세 개예요.',x:'윈도우는 오른쪽 위에 —·☐·✕, 맥은 왼쪽 위에 빨강(닫기)·노랑(최소화)·초록(확대) 동그라미로 있어요. 제목 줄을 직접 그리는 앱도 이 자리와 순서는 지켜요.',p:'제목 줄을 직접 만든 데스크톱 앱이야. 윈도우에서는 오른쪽 위에 Window Controls(최소화·최대화·닫기)를 기본 순서대로 넣어줘',r:['Title Bar','Menu Bar'],l:1,o:0,j:'맥 버튼은 "트래픽 라이트"',v:'u-window-controls'},

 {en:'Line Icon vs Solid Icon',ko:'선 아이콘·면 아이콘',d:'선으로만 그린 아이콘과 안을 꽉 채운 아이콘의 차이예요.',x:'하단 탭 바에서 고르지 않은 탭은 선 아이콘, 고른 탭은 면 아이콘으로 바꿔 지금 위치를 알려 주기도 해요. 그 밖에는 한 화면에서 한 가지로 맞춰요.',p:'하단 탭 바 아이콘을 평소엔 선 아이콘, 고른 탭만 면 아이콘으로 바꿔줘',r:['Icon','Tab Bar','Stroke'],l:1,o:0,v:'u-line-icon-vs-solid-icon'},
 {en:'Squircle',ko:'스쿼클',d:'네모와 동그라미의 중간처럼, 모서리 곡선이 서서히 이어지는 둥근 네모예요.',x:'square와 circle을 합친 말이에요. CSS border-radius는 모서리를 원의 일부로 깎아 곧은 선과 곡선이 갑자기 만나지만, 스쿼클은 곡선이 부드럽게 이어져요. 아이폰 앱 아이콘 모양이 이와 비슷해요.',p:'앱 아이콘 모서리를 보통 둥근 모서리 대신 스쿼클 모양으로 만들어줘',r:['Border Radius','Icon'],l:2,o:0,v:'u-squircle'},
 {en:'Grain Texture',ko:'노이즈 질감 · 그레인',d:'매끈한 색면에 자글자글한 점을 살짝 뿌려, 종이나 필름 같은 거친 느낌을 주는 효과예요.',x:'넓은 그라데이션에 생기는 띠 무늬(밴딩)를 덜 보이게 하는 데도 써요. 너무 진하면 모래처럼 지저분해 보여서 아주 옅게 깔아요.',p:'메인 배경 그라데이션 위에 아주 옅은 노이즈 질감을 깔아줘',r:['Gradient','Mesh Gradient'],l:2,o:0,v:'u-grain-texture'},
 {en:'Duotone',ko:'듀오톤',d:'사진의 밝은 곳과 어두운 곳을 정해 둔 두 가지 색으로만 바꿔 칠하는 효과예요.',x:'잉크 두 가지로 찍는 인쇄 기법에서 왔어요. 색이 제각각인 사진들도 같은 두 색으로 바꾸면 한 묶음처럼 보여요.',p:'팀원 사진들을 남색과 살구색 두 가지만 쓰는 듀오톤으로 바꿔 통일해줘',r:['Color Palette','Grain Texture'],l:2,o:0,v:'u-duotone'},
 {en:'Minimalism',ko:'미니멀 · 미니멀리즘',d:'꼭 필요한 것만 남기고 장식을 빼서, 여백이 넉넉하고 단순한 화면을 만드는 스타일이에요.',x:'빼기만 하면 썰렁해져요. 남은 몇 가지의 크기·간격·글꼴을 더 정성껏 다듬는 게 핵심이에요.',p:'랜딩 페이지를 미니멀하게 바꿔서 제목 하나, 설명 한 줄, 버튼 하나만 남기고 여백을 넉넉히 줘',r:['Whitespace','Flat Design','Visual Hierarchy'],l:1,o:0,v:'u-minimalism'},
 {en:'Brutalism',ko:'브루탈리즘',d:'굵은 테두리, 각진 모서리, 강한 원색처럼 꾸밈없이 거칠고 대담하게 만드는 스타일이에요.',x:'이름은 "잔인한"이 아니라, 거친 콘크리트를 그대로 드러낸 건축(béton brut)에서 왔어요. 일부러 투박하게 보이는 것이라 읽기 쉬움은 따로 챙겨야 해요.',p:'이벤트 페이지를 굵은 검정 테두리, 각진 모서리, 노란 강조색을 쓴 브루탈리즘 스타일로 만들어줘',r:['Border','Box Shadow','Minimalism'],l:2,o:0,v:'u-brutalism'},

 {en:'Illustration',ko:'일러스트',d:'사진 대신 그린 그림으로 설명이나 분위기를 전하는 것이에요.',x:'첫 사용 안내·빈 화면·오류 화면처럼 글만으로는 딱딱한 곳에 많이 써요. 한 서비스 안에서는 선 굵기와 색을 맞춰야 한 벌처럼 보여요.',p:'첫 사용 안내 화면마다 같은 선 굵기와 색을 쓴 일러스트를 넣어줘',r:['Empty State','Isometric','Color Palette'],l:1,o:0,v:'u-illustration'},

 {en:'Tap',ko:'탭 · 한 번 누르기',d:'손가락으로 화면을 한 번 가볍게 눌렀다 떼는 동작이에요. 마우스의 클릭과 같아요.',x:'누르는 순간 바로 색이 바뀌어야 눌렸다는 걸 알아요. 손을 뗄 때 실행하면, 누른 채 손가락을 밖으로 빼서 취소할 수도 있어요.',p:'목록 줄을 탭하면 누르는 순간 배경이 바뀌고 손을 떼면 상세 화면이 열리게 만들어줘',r:['Touch Target','Pressed State'],l:1,o:0,v:'u-tap'},

 {en:'x-height',ko:'x 높이 · 엑스하이트',d:'영문 소문자 x의 높이예요. 글자 크기가 같아도 x 높이가 큰 서체는 더 커 보이고, 작은 글씨에서도 잘 읽혀요.',x:'CSS의 ex 단위가 이 높이를 뜻해요. 서체를 바꿨더니 같은 크기인데 작아 보인다면 x 높이 차이 때문일 수 있어요.',p:'본문이 작아 보이니 x-height(x 높이)가 더 큰 서체로 바꿔줘',r:['Baseline','Cap Height','Font Size','Readability'],l:3,o:0,v:'u-x-height'},
 {en:'Cap Height',ko:'대문자 높이 · 캡 하이트',d:'영문 대문자 H처럼 위가 평평한 대문자의 꼭대기까지 높이예요. 글자 옆 아이콘을 이 높이에 맞추면 크기가 잘 어울려 보여요.',x:'CSS에는 이 높이를 기준으로 하는 cap 단위가 있어요. 2023년 말부터 주요 브라우저에서 쓸 수 있어요.',p:'버튼 아이콘 크기를 Cap Height(대문자 높이)에 맞춰서 글자와 어울리게 해줘',r:['x-height','Baseline','Icon Button'],l:3,o:0,v:'u-cap-height'},
 {en:'Ligature',ko:'합자 · 리거처',d:'두 글자가 만날 때 하나로 이어 그린 글자예요. 영문 f와 i처럼 붙으면 부딪히는 글자를 한 덩어리로 그려 깔끔하게 보여요.',x:'어떤 합자가 들어 있는지는 글꼴마다 달라요. CSS의 font-variant-ligatures로 켜거나 끌 수 있어요.',p:'로고의 fi가 붙어 보이지 않게 Ligature(합자)를 꺼줘',r:['Kerning','Letter Spacing'],l:3,o:0,v:'u-ligature'},
 {en:'Myeongjo vs Gothic',ko:'명조와 고딕 · 바탕과 돋움',d:'한글 서체의 두 큰 갈래예요. 명조는 붓으로 쓴 것처럼 획 굵기가 달라지고 끝에 맺음이 있고, 고딕은 획 굵기가 고르고 끝이 깔끔해요.',x:'1993년 문화부가 명조는 "바탕", 고딕은 "돋움"으로 부르자고 권해서 바탕체·돋움체라는 이름도 함께 써요. 영문의 세리프·산세리프와 비슷한 관계예요.',j:'"제목은 명조로, 본문은 고딕으로 가 주세요"',p:'본문은 Gothic(고딕) 계열로 두고, 인용문만 Myeongjo(명조) 계열로 바꿔줘',r:['Serif','Sans-serif','Typeface vs Font'],l:1,o:0,v:'u-myeongjo-vs-gothic'},
 {en:'Subset',ko:'서브셋 · 필요한 글자만 담기',d:'글꼴 파일에서 실제로 쓸 글자만 골라 담아 파일을 가볍게 만드는 일이에요. 한글은 글자 수가 많아서 통째로 담으면 파일이 무거워요.',x:'현대 한글은 조합하면 11,172자인데, 옛 완성형 표준(KS X 1001)은 자주 쓰는 2,350자만 담았어요. 서브셋도 이렇게 쓸 글자만 고르는 일이고, 담지 않은 글자는 다른 글꼴로 바뀌어 보여요.',p:'웹 폰트를 Subset(서브셋)으로 줄여서 사이트에 쓰는 글자만 담아줘',r:['Web Font','Fallback Font','FOUT'],l:3,o:0,v:'u-subset'},
 {en:'Italic',ko:'이탤릭 · 기울임꼴',d:'글자를 오른쪽으로 비스듬히 기울인 글꼴이에요. 본문 속 일부 단어를 다른 글자와 구별해 보이게 할 때 써요.',x:'진짜 이탤릭은 기울인 모양을 새로 그린 별도 글꼴이에요. 한글 글꼴에는 이탤릭이 거의 없어서 브라우저가 보통 글자를 기울여 흉내 내요. CSS font-synthesis로 이 흉내를 막을 수 있어요.',p:'한글 강조는 Italic(이탤릭) 대신 굵게 바꿔줘',r:['Font Weight','Font Family'],l:2,o:0,v:'u-italic'},
 {en:'Heading Levels',ko:'제목 단계 · H1~H6',d:'글의 제목을 가장 큰 제목(H1)부터 가장 작은 제목(H6)까지 여섯 단계로 나눈 것이에요. 책의 장·절처럼 글의 뼈대를 보여 줘요.',x:'한 페이지에 H1은 보통 하나만 두고, H2 다음에 H4처럼 단계를 건너뛰지 않아요. 화면 읽기 프로그램 사용자는 제목을 따라 페이지를 훑어보기 때문이에요.',p:'이 페이지 Heading Levels(제목 단계)를 H1은 하나만, 섹션 제목은 H2로 맞춰줘',r:['Semantic HTML','Visual Hierarchy','Font Size'],l:2,o:0,v:'u-heading-levels'},
 {en:'Body Text',ko:'본문 · 본문 글자',d:'제목이나 버튼 글자가 아닌, 실제로 길게 읽는 글이에요. 화면에서 가장 많은 자리를 차지하니 읽기 편한 크기와 줄 간격이 중요해요.',x:'브라우저 기본 글자 크기는 보통 16px이라 웹 본문도 대개 여기서 시작해요. 여러 줄로 이어지는 글은 줄 간격을 글자 크기의 1.5배 안팎으로 넉넉히 잡아요.',p:'Body Text(본문 글자)를 16px, 줄 간격 1.6으로 맞춰서 읽기 편하게 해줘',r:['Font Size','Line Height','Readability'],l:1,o:0,v:'u-body-text'},
 {en:'Orphan / Widow',ko:'외톨이 줄 · 고아·과부 줄',d:'문단 끝에 한 단어만 따로 남은 마지막 줄이나, 단·쪽이 바뀌면서 한 줄만 떨어져 나간 줄이에요. 보기에 허전하고 읽는 흐름이 끊겨요.',x:'CSS의 orphans·widows는 인쇄나 단 나누기에서 끊긴 자리 앞뒤에 최소 몇 줄을 남길지 정해요. 화면 문단 끝의 외톨이 단어는 text-wrap: pretty로 줄일 수 있어요. 두 이름은 사람마다 반대로 쓰기도 해요.',p:'문단 끝에 한 단어만 남는 Orphan / Widow(외톨이 줄)를 text-wrap: pretty로 줄여줘',r:['Word Break','Line Height','Readability'],l:3,o:0,v:'u-orphan-widow'},
 {en:'Font License',ko:'글꼴 라이선스 · 사용 허락 범위',d:'글꼴을 어디에, 어디까지 써도 되는지 정한 약속이에요. 무료 글꼴이라도 웹사이트·인쇄물·영상·로고처럼 쓰는 곳마다 허락 범위가 다를 수 있어요.',x:'많이 쓰는 SIL 오픈 폰트 라이선스(OFL)는 웹사이트에 넣거나 작업물에 쓰는 건 허락하지만, 글꼴 파일만 따로 파는 건 막아요. 쓰기 전에 글꼴과 함께 온 라이선스 문서를 확인해요.',p:'이 사이트에 쓴 글꼴들의 Font License(글꼴 라이선스)가 웹 사용을 허락하는지 확인해줘',r:['Web Font','Open Source','Subset'],l:2,o:0,v:'u-font-license'},

const grab = (el, h) => { let o = null;
  const end = (e, c) => { if (!o) return; const dx = e.clientX - o.x, dy = e.clientY - o.y; o = null; h.up && h.up(e, dx, dy, c); };

  'u-inline-validation':{h:hint('칸을 고쳐 써 보세요') + phone(`<b>회원가입</b><label class="mk-f"><span class="mk-l">이메일</span><input class="mk-in bad" value="hong@" aria-invalid="true" autocomplete="off" spellcheck="false"></label>

    init: s => { const i = s.querySelector('input'), m = s.querySelector('.mk-msg'); m.id = uid(); i.setAttribute('aria-describedby', m.id);

      i.addEventListener('input', chk); i.addEventListener('blur', chk); }},

  'u-text-area':{h:phone(`<b>문의하기</b><div class="mk-f"><span class="mk-l">문의 내용</span><span class="mk-in mk-ta mk-hl">배송이 언제쯤 오는지 궁금해요.<br>주문 번호는 1042예요.<i class="mk-grip"></i></span>
    <span class="mk-help" style="text-align:right">31 / 200자</span></div><span class="mk-btn" style="margin-top:auto">보내기</span>`), cap:'여러 줄이 들어가고, 모서리를 끌어 칸을 키울 수 있어요'},
  'u-select-box':{h:phone(`<b>배송지</b><div class="mk-f"><span class="mk-l">지역</span><span class="mk-in mk-sel on">서울 <span aria-hidden="true">▾</span></span></div>
    <div class="mk-card mk-opts">${['서울','부산','대구','광주'].map((x, k) => `<div class="${k ? '' : 'on'}">${x}</div>`).join('')}</div>`), cap:'폼 안의 칸을 누르면 정해진 보기 목록이 열려요'},
  'u-autocomplete':{h:hint('써 보세요 (↑↓로 고르고 Enter)') + phone(`<b>기차 예매</b><label class="mk-f"><span class="mk-l">도착 도시</span><input class="mk-in" value="서" role="combobox" aria-autocomplete="list" aria-expanded="false" autocomplete="off" spellcheck="false"></label>

    init: s => { const i = s.querySelector('input'), box = s.querySelector('[role=listbox]'), CITY = ['서울','서귀포','서산','수원','세종','부산','부천','대구','대전'];
      box.id = uid(); i.setAttribute('aria-controls', box.id); let a = -1, list = [];

const visual = t => {
  const v = t.v; let h = '', lab = [], m = 0, cap = '', init;
  if (typeof v === 'string' && D[v]) ({h, lab = [], m = 0, cap = '', init} = D[v]);
  else if (v && v.flow) {
    h = `<div class="flow">${v.flow.map((n, i) => (i ? `<div class="edge"><span>${esc((v.e||[])[i-1]||'')}</span><div class="ln"></div><span>→</span></div>` : '') +
      `<div class="node${(v.hl||[]).includes(i) ? ' hl' : ''}">${esc(n)}</div>`).join('')}</div>`; m = 1;
  } else if (v && v.stack) h = `<div class="stack">${v.stack.map((n,i) => `<div class="${(v.hl||[]).includes(i)?'hl':''}">${esc(n)}</div>`).join('')}</div>`;
  else if (v && v.tbl) h = `<table class="tbl"><tr>${v.tbl[0].map(x => `<th>${esc(x)}</th>`).join('')}</tr>${v.tbl.slice(1).map((r,i) => `<tr class="${(v.hl||[]).includes(i)?'hl':''}">${r.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`;
  else if (v && v.code) h = `<div class="codebox">${esc(v.code).replace(/\/\/[^\n]*|#[^\n]*/g, s => `<span class="c">${s}</span>`)}</div>`;
  else if (v && v.tree) h = `<div class="tree">${v.tree.map((l,i) => (v.hl||[]).includes(i) ? `<span class="hl">${esc(l)}</span>` : esc(l)).join('\n')}</div>`;
  else if (v && v.page) h = `<div class="page">${[['hd','헤더'],['nv','내비게이션'],['hr','히어로'],['mn','본문'],['sd','사이드바'],['ft','푸터']].map(([a,n]) => `<div style="grid-area:${a}" class="${v.page===a?'hl':''}">${n}</div>`).join('')}</div>`;
  else if (v && v.win) h = `<div class="win">${[['tt','타이틀 바'],['mb','메뉴 바'],['tb','툴바'],['sb','사이드 패널'],['ct','작업 영역'],['st','상태 표시줄']].map(([a,n]) => `<div style="grid-area:${a}" class="${v.win===a?'hl':''}">${n}</div>`).join('')}</div>`;
  else if (v && v.http) h = `<div class="http e${String(v.http)[0]}"><b>${esc(v.http)}</b><span>${esc(v.msg||'')}</span></div>`;
  else if (v && v.git) h = gitSvg(v.git);
  else if (v && v.cmp) h = `<div class="cmp"><div class="bad" data-l="${esc(v.cmp[0])}">${v.cmp[1]}</div><div class="good" data-l="${esc(v.cmp[2])}">${v.cmp[3]}</div></div>`;
  else if (v && v.big) h = `<div class="term-big">${esc(v.big)}<small>${esc(v.sub||'')}</small></div>`;
  else h = `<div class="term-big">${esc(t.en)}<small>${esc(t.ko)}</small></div>`;
  if (v && v.cap) cap = v.cap;
  return {h, lab, m, cap, init};
};
function gitSvg(kind){
  const c = (x,y,f='#fff') => `<circle cx="${x}" cy="${y}" r="8" fill="${f}"/>`;
  const main = '<path d="M20 90H380" stroke="var(--ink)"/>';
  const k = {
    commit:`${main}${[40,110,180,250].map((x,i)=>c(x,90,i==3?'var(--mark)':'#fff')).join('')}<text x="232" y="118">새 커밋</text><text x="20" y="72">main</text>`,
    branch:`${main}<path d="M110 90C150 90 150 40 190 40H330" stroke="var(--moss)"/>${c(40,90)}${c(110,90)}${c(180,90)}${c(200,40)}${c(270,40)}<text x="20" y="72">main</text><text x="210" y="24">feature 브랜치</text>`,
    merge:`${main}<path d="M80 90C120 90 120 40 160 40H250C290 40 290 90 330 90" stroke="var(--moss)"/>${c(40,90)}${c(140,90)}${c(180,40)}${c(240,40)}${c(330,90,'var(--mark)')}<text x="300" y="118">합치기(merge)</text>`,
    conflict:`${main}<path d="M80 90C120 90 120 40 160 40H250C290 40 290 90 330 90" stroke="var(--mark)"/>${c(40,90)}${c(200,90)}${c(200,40)}${c(330,90,'var(--mark)')}<text x="150" y="122">같은 줄을 둘 다 고침</text><text x="282" y="72">충돌!</text>`,
    rebase:`${main}<path d="M250 90C280 90 280 40 310 40H380" stroke="var(--moss)" stroke-dasharray="5 5"/>${c(40,90)}${c(110,90)}${c(180,90)}${c(250,90)}${c(320,40)}${c(370,40)}<text x="250" y="24">맨 끝으로 옮겨 붙임</text>`,
    push:`<rect x="20" y="50" width="120" height="60" rx="8" fill="#fff" stroke="var(--ink)" stroke-width="2"/><rect x="260" y="50" width="120" height="60" rx="8" fill="var(--ink)"/><path d="M145 80H250" stroke="var(--mark)"/><text x="48" y="84">내 컴퓨터</text><text x="285" y="84" fill="#fff" style="fill:#fff">GitHub</text><text x="170" y="70">push ↑</text>`,
    pull:`<rect x="20" y="50" width="120" height="60" rx="8" fill="#fff" stroke="var(--ink)" stroke-width="2"/><rect x="260" y="50" width="120" height="60" rx="8" fill="var(--ink)"/><path d="M255 80H150" stroke="var(--moss)"/><text x="48" y="84">내 컴퓨터</text><text x="285" y="84" style="fill:#fff">GitHub</text><text x="170" y="70">pull ↓</text>`
  }[kind] || main;
  return `<svg class="gitg" viewBox="0 0 400 140" role="img" aria-label="Git 그림">${k}</svg>`;

/* ---------- render pieces ---------- */
const lvl = n => `<span class="lvl" aria-label="난이도 ${['쉬움','보통','어려움'][n-1]}">${[1,2,3].map(i => `<i class="${i<=n?'on':''}"></i>`).join('')}</span> ${['쉬움','보통','어려움'][n-1]}`;
const plate = t => {

  const rel = (t.r || []).map(n => { const r = find(n); return r ? `<a href="#/t/${r.id}">${esc(r.en)}</a>` : `<span>${esc(n)}</span>`; }).join('');
  const src = t.o ? (t.u ? `<a class="tag" href="${esc(t.u)}" target="_blank" rel="noopener">공식 문서 ${ic('ext')}</a>` : `<span class="tag">공식</span>`) : `<span class="tag prac">실무</span>`;
  return `<article class="plate${learned.has(t.id)?' learned':''}" id="${t.id}">
    <figure class="fig" data-id="${t.id}"><div class="stage"></div><figcaption class="figcap"><b>도판 ${t.no}</b> · ${esc(t.ko.split('·')[0].trim())}</figcaption></figure>
    <div class="desc">

          <button class="act" data-pin="${t.id}" aria-pressed="${pins.has(t.id)}" title="즐겨찾기 핀">${ic('pin')}<span class="sr">즐겨찾기</span></button>
          <button class="act" data-learn="${t.id}" aria-pressed="${learned.has(t.id)}" title="외움 도장">${ic('stamp')}<span class="sr">외웠어요</span></button>
        </div></div>
      ${rows}${says}
      <div class="tags">${src}${t.jg ? '<span class="tag jg">현업 은어</span>' : ''}<span class="tag">${lvl(t.l || 1)}</span><a class="tag" href="#/c/${c.id}/${s.id}">${esc(s.name)}</a></div>
      ${rel ? `<div class="rel">관련 용어 ${rel}</div>` : ''}
    </div><span class="stamp" aria-hidden="true">외움</span></article>`;
};

/* lazy visuals */
const io = new IntersectionObserver(es => es.forEach(e => {
  const f = e.target;
  if (e.isIntersecting) { mount(f); f.classList.add('seen'); if (!reduced && f.dataset.m && f.dataset.paused !== '1') f.classList.add('run'); }
  else f.classList.remove('run');
}), {rootMargin: '120px 0px'});
function mount(f){
  if (f.dataset.ok) return; f.dataset.ok = 1;
  const t = byId.get(f.dataset.id), {h, lab, m, cap, init} = visual(t), st = f.querySelector('.stage');
  st.innerHTML = h;
  if (init) init(st);
  if (lab.length) {
    const len = 400;
    f.insertAdjacentHTML('beforeend', `<svg class="leaders" aria-hidden="true">${lab.map(l => `<line x1="${l.x}%" y1="${l.y}%" x2="${l.lx}%" y2="${l.ly}%" style="--len:${len}"/><circle cx="${l.x}%" cy="${l.y}%" r="3.5"/>`).join('')}</svg>` +
      lab.map(l => `<span class="lab" style="left:${l.lx}%;top:${l.ly}%">${esc(l.t)}</span>`).join(''));
  }
  if (cap) f.querySelector('.figcap').insertAdjacentHTML('beforeend', ` — ${esc(cap)}`);
  if (m) { f.dataset.m = 1; f.insertAdjacentHTML('beforeend', `<button class="play" data-play>${reduced ? ic('play') + '재생' : ic('pause') + '멈춤'}</button>`); }
}
function playToggle(btn){
  const f = btn.closest('.fig'), on = !f.classList.contains('run');
  f.classList.toggle('run', on); f.dataset.paused = on ? '0' : '1';
  btn.innerHTML = on ? ic('pause') + '멈춤' : ic('play') + '재생';
}

const keyState = {g: null, q: null};
function keyBand(){

  const syms = SYMPTOMS.filter(s => s.g === keyState.g);
  const sym = SYMPTOMS[keyState.q];
  return `<section class="key" aria-label="검색표">
    <div class="key-top"><strong class="kh">검색표</strong><span class="key-q">용어를 몰라도 괜찮아요. 보이는 증상을 골라 찾아가세요.</span>
      <label class="search">${ic('search')}<span class="sr">검색</span><input id="q" type="search" placeholder="증상이나 용어로 찾기 (예: 흔들려요)" autocomplete="off"><kbd>/</kbd></label></div>
    <div class="steps"><div class="col${keyState.g ? ' done' : ''}"><span class="step-lab"><b>1</b>무엇이 이상한가요?</span>
      <div class="chips">${(keyState.g ? [keyState.g] : groups).map(g => `<button class="chip" data-g="${esc(g)}" aria-pressed="${g===keyState.g}">${esc(g)}${g===keyState.g ? '<span class="redo">바꾸기</span>' : ''}</button>`).join('')}</div></div>
    ${keyState.g ? `<span class="arr" aria-hidden="true">→</span><div class="col${sym ? ' done' : ''}"><span class="step-lab"><b>2</b>어떤 모습인가요?</span><div class="chips">${(sym ? [sym] : syms).map(s => `<button class="chip" data-q="${SYMPTOMS.indexOf(s)}" aria-pressed="${s===sym}">${esc(s.q)}${s===sym ? '<span class="redo">바꾸기</span>' : ''}</button>`).join('')}</div></div>` : ''}
    ${sym && sym.g === keyState.g ? `<span class="arr" aria-hidden="true">→</span><div class="col"><span class="step-lab"><b>3</b>이 용어를 보세요</span><div class="chips">${sym.t.map(n => { const r = find(n); return r ? `<a class="chip term" href="#/t/${r.id}">${esc(r.en)} · ${esc(r.ko.split('·')[0].trim())}</a>` : ''; }).join('')}</div></div>` : ''}
    </div></section>`;
}
function renderNav(cur){
  const learnedIn = c => TERMS.filter(t => t.c === c.id && learned.has(t.id)).length;
  $('#nav').innerHTML = `<a class="brand" href="#/">${esc(SITE.name)}</a><div class="vol">도감 · ${CATS.length}권 ${TERMS.length}종</div>
    <div class="navlinks"><a href="#/" ${!cur.c && !cur.pins ? 'aria-current="page"' : ''}>${ic('home')}처음</a><a href="#/pins" ${cur.pins ? 'aria-current="page"' : ''}>${ic('pin')}핀 ${pins.size}</a></div>
    ${CATS.map(c => `<a class="cat" href="#/c/${c.id}" ${cur.c === c.id ? 'aria-current="page"' : ''}><span class="no">${String(c.no).padStart(2,'0')}</span>${esc(c.name)}<span class="cnt"><span class="sr">외움 </span>${learnedIn(c)}/${c.count}</span></a>
      ${cur.c === c.id ? `<div class="subs">${c.secs.map(s => `<a href="#/c/${c.id}/${s.id}" ${cur.s === s.id ? 'aria-current="page"' : ''}>${esc(s.name)}</a>`).join('')}</div>` : ''}`).join('')}`;
}
function viewHome(){
  return `<h1 class="title" style="margin-top:34px">${esc(SITE.name)}</h1>
    <p class="lead">${esc(SITE.tagline)}. 용어마다 움직이는 그림과, Claude에게 그대로 보낼 수 있는 말하기 예문이 있어요.</p>
    <div class="howto"><div><b>증상으로 찾기</b>위 검색표에서 보이는 증상을 고르면 그 현상의 이름을 알려 줘요.</div>
      <div><b>그림으로 이해하기</b>도판마다 실제로 움직이는 예시가 있어요. 멈춤·재생 버튼으로 다시 볼 수 있어요.</div>
      <div><b>예문 복사해 지시하기</b>말하기 예문을 복사해 Claude에게 붙여 넣으세요. 핀과 외움 도장으로 정리할 수 있어요.</div></div>
    <h2 class="h2">${CATS.length}권의 도감</h2><p>분야를 골라 들어가면 기본부터 심화까지 차례로 볼 수 있어요.</p>
    <div class="shelf">${CATS.map(c => `<a class="vol-row" href="#/c/${c.id}"><span class="no">${String(c.no).padStart(2,'0')}</span><span class="nm">${esc(c.name)}</span><span class="ct">${c.count}종</span><span class="ds">${esc(c.desc)}</span></a>`).join('')}</div>`;
}
function viewSection(c, s, t){
  return `<nav class="crumb" aria-label="현재 위치"><a href="#/">처음</a><span>›</span><a href="#/c/${c.id}">${String(c.no).padStart(2,'0')} ${esc(c.name)}</a><span>›</span>${esc(s.name)}${t ? `<span>›</span>도판 ${t.no}` : ''}</nav>
    <h1 class="title">${esc(c.name)}</h1><p class="lead">${esc(c.desc)}</p>
    <nav class="secs" aria-label="하위항목">${c.secs.map(x => `<a class="sec" href="#/c/${c.id}/${x.id}" ${x.id === s.id ? 'aria-current="page"' : ''}>${esc(x.name)}<small>${x.terms.length}</small></a>`).join('')}</nav>
    <h2 class="sec-intro"><span class="sr">${esc(s.name)} — </span>${esc(s.desc)}</h2>
    <div class="plates">${s.terms.length ? s.terms.map(plate).join('') : '<div class="empty"><b>아직 용어가 없어요</b>곧 채워질 예정이에요.</div>'}</div>`;
}
function viewList(title, lead, list, emptyMsg){
  return `<h1 class="title" style="margin-top:34px">${esc(title)}</h1><p class="lead">${lead}</p>
    <div class="plates">${list.length ? list.map(plate).join('') : `<div class="empty">${emptyMsg}</div>`}</div>`;
}
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
function search(q){
  const n = norm(q); if (!n) return [];
  const symHits = new Set(SYMPTOMS.filter(s => norm(s.q).includes(n)).flatMap(s => s.t.map(x => find(x)).filter(Boolean)));
  const score = t => { const en = norm(t.en), ko = norm(t.ko);
    if (en === n || ko.split('·').some(k => k === n)) return 0;
    if (en.startsWith(n) || ko.includes(n)) return 1;
    if (symHits.has(t)) return 2;
    if (norm(t.j).includes(n) || norm((t.sy||[]).join()).includes(n)) return 3;
    if (norm(t.d).includes(n) || norm(t.x).includes(n) || norm([].concat(t.p||[]).join()).includes(n)) return 4; return 9; };
  return TERMS.map(t => [score(t), t]).filter(([s]) => s < 9).sort((a, b) => a[0] - b[0]).map(([, t]) => t).slice(0, 60);
}
function showSearch(q){
  const list = search(q);
  $('#view').innerHTML = viewList(`"${q}" 찾기 결과`, `${list.length}개 용어를 찾았어요. 원하는 게 없으면 다른 말로 찾거나 위 검색표에서 증상을 골라 보세요.`, list,
    '<b>찾는 용어가 없어요</b>다른 말로 찾아보거나, 위 검색표에서 증상을 골라 보세요.');
  observe();
}
function observe(){ document.querySelectorAll('#view .fig').forEach(f => io.observe(f)); }

function route(){
  const h = decodeURIComponent(location.hash.slice(2)).split('/');
  if (h[0] === 't' && MOVED[h[1]]) { location.replace('#/t/' + MOVED[h[1]]); return; }
  let cur = {}, html = '';
  if (h[0] === 'c' && catById.has(h[1])) {
    const c = catById.get(h[1]), s = c.secs.find(x => x.id === h[2]) || c.secs[0]; cur = {c: c.id, s: s.id}; html = viewSection(c, s);
  } else if (h[0] === 't' && byId.has(h[1])) {
    const t = byId.get(h[1]), c = catById.get(t.c); cur = {c: c.id, s: t.s, t: t.id}; html = viewSection(c, c.secs.find(x => x.id === t.s), t);
  } else if (h[0] === 'pins') {
    cur = {pins: 1}; html = viewList('핀 꽂은 용어', '핀을 꽂아 둔 용어만 모아 봤어요. 자주 쓰는 말을 여기 두세요.', TERMS.filter(t => pins.has(t.id)), '<b>아직 핀이 없어요</b>도판 오른쪽 위 핀 버튼을 누르면 여기 모여요.');
  } else if (h[0] === 's' && h[1]) {
    renderNav({}); $('#q').value = h[1]; showSearch(h[1]); return;
  } else html = viewHome();
  renderNav(cur);
  $('#view').innerHTML = html; observe();
  closeNav();
  if (cur.t) { const el = document.getElementById(cur.t); if (el) { el.scrollIntoView({block: 'start'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2200); } }
  else window.scrollTo(0, 0);
}

/* ---------- events ---------- */
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1600); };
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const a = document.createElement('textarea'); a.value = text; document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('예문을 복사했어요');
}
const closeNav = () => $('#nav').classList.remove('open');
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy) copy(b.dataset.copy);
  else if ('play' in b.dataset) playToggle(b);
  else if (b.dataset.pin) { const id = b.dataset.pin, on = !pins.has(id); on ? pins.add(id) : pins.delete(id); store.set('pins', pins);
    document.querySelectorAll(`[data-pin="${id}"]`).forEach(x => x.setAttribute('aria-pressed', on)); renderNavKeep(); toast(on ? '핀을 꽂았어요' : '핀을 뺐어요'); }
  else if (b.dataset.learn) { const id = b.dataset.learn, on = !learned.has(id); on ? learned.add(id) : learned.delete(id); store.set('learned', learned);
    document.querySelectorAll(`[data-learn="${id}"]`).forEach(x => { x.setAttribute('aria-pressed', on); x.closest('.plate').classList.toggle('learned', on); }); renderNavKeep(); }
  else if (b.dataset.g) { keyState.g = keyState.g === b.dataset.g ? null : b.dataset.g; keyState.q = null; renderKey(); }
  else if (b.dataset.q) { keyState.q = keyState.q === +b.dataset.q ? null : +b.dataset.q; renderKey(); }
  else if (b.classList.contains('menu-btn')) $('#nav').classList.toggle('open');
});
function renderNavKeep(){ const h = decodeURIComponent(location.hash.slice(2)).split('/'); const t = h[0]==='t' && byId.get(h[1]);
  renderNav(h[0]==='c' ? {c:h[1], s:h[2] || (catById.get(h[1])||{secs:[{}]}).secs[0].id} : t ? {c:t.c, s:t.s} : h[0]==='pins' ? {pins:1} : {}); }
function renderKey(){ const q = $('#q') ? $('#q').value : ''; $('#keyband').innerHTML = keyBand(); $('#q').value = q; }
let qt;
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return; clearTimeout(qt);
  qt = setTimeout(() => { const q = e.target.value.trim();
    if (q) { history.replaceState(null, '', '#/s/' + encodeURIComponent(q)); showSearch(q); } else { history.replaceState(null, '', '#/'); route(); } }, 180);
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') closeNav();
});

$('#main').innerHTML = `<div class="inner"><button class="menu-btn" aria-label="목차 열기">${ic('menu')}목차</button><div id="keyband"></div><div id="view"></div></div>`;
renderKey();
addEventListener('hashchange', route);
route();
})();
</script>
</body>
</html>
